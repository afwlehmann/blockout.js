name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Dependencies — install once, cache node_modules for downstream jobs
  # ─────────────────────────────────────────────────────────────────────
  deps:
    name: Dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          determinate: false

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Cache node_modules
        id: cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: nix develop -c npm ci

  # ─────────────────────────────────────────────────────────────────────
  # Build
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: Build
    needs: deps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          determinate: false

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      - name: Build
        run: nix develop -c npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: blockout-dist
          path: dist/
          retention-days: 30
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────
  # Lint
  # ─────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    needs: deps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          determinate: false

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      - name: Lint
        run: nix develop -c npm run lint

      - name: Format check
        run: nix develop -c npm run format:check

      - name: Typecheck
        run: nix develop -c npm run typecheck

      - name: Nixfmt
        run: nix develop -c nixfmt -c $(git ls-files '*.nix')

      - name: Convco
        run: nix develop -c convco check

  # ─────────────────────────────────────────────────────────────────────
  # Test
  # ─────────────────────────────────────────────────────────────────────
  test:
    name: Test
    needs: deps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          determinate: false

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Restore node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('package-lock.json') }}
          fail-on-cache-miss: true

      - name: Test
        run: nix develop -c npm test

  # ─────────────────────────────────────────────────────────────────────
  # Publish — deploy the built artifact to GitHub Pages
  # ─────────────────────────────────────────────────────────────────────
  publish:
    name: Publish
    needs: [build, lint, test]
    runs-on: ubuntu-24.04
    # Only publish on the default branch; PRs build but don't deploy.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: blockout-dist
          path: dist/

      - name: Package distribution archive
        run: |
          tar -czf blockout-${{ github.sha }}.tar.gz -C dist .
          zip -r -q blockout-${{ github.sha }}.zip dist/

      - name: Upload release artifact (tar.gz)
        uses: actions/upload-artifact@v7
        with:
          name: blockout-${{ github.sha }}-tarball
          path: blockout-${{ github.sha }}.tar.gz
          retention-days: 90
          if-no-files-found: error

      - name: Upload release artifact (zip)
        uses: actions/upload-artifact@v7
        with:
          name: blockout-${{ github.sha }}-zip
          path: blockout-${{ github.sha }}.zip
          retention-days: 90
          if-no-files-found: error

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
